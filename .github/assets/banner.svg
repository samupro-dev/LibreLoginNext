<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">LibreLogin Next</title>
  <desc id="desc">Secure authentication and premium autologin for Paper and Velocity</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#121A3A"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.1" r="0.4">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <rect width="1280" height="400" fill="url(#glowA)"/>
    <rect width="1280" height="400" fill="url(#glowB)"/>
    <rect x="0.5" y="0.5" width="1279" height="399" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- Shield with padlock -->
    <g transform="translate(150 80)">
      <path d="M120 0 L228 40 V118 C228 186 182 226 120 248 C58 226 12 186 12 118 V40 Z"
            fill="#0F172A" fill-opacity="0.55" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M120 22 L208 54 V118 C208 172 172 205 120 225 C68 205 32 172 32 118 V54 Z"
            fill="url(#accent)" fill-opacity="0.08"/>
      <path d="M90 118 V96 C90 79 103 66 120 66 C137 66 150 79 150 96 V118"
            fill="none" stroke="#E0E7FF" stroke-width="10" stroke-linecap="round"/>
      <rect x="74" y="114" width="92" height="74" rx="14" fill="url(#accent)"/>
      <circle cx="120" cy="144" r="10" fill="#0B1020"/>
      <rect x="116" y="148" width="8" height="20" rx="4" fill="#0B1020"/>
    </g>

    <!-- Text -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
      <text x="450" y="128" font-size="18" font-weight="600" letter-spacing="4" fill="#A5B4FC">MINECRAFT AUTHENTICATION</text>
      <text x="446" y="200" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#titleFill)">LibreLogin Next</text>
      <text x="450" y="244" font-size="24" font-weight="400" fill="#CBD5E1">Secure login, premium autologin and 2FA for Paper &amp; Velocity</text>

      <g font-size="16" font-weight="600" fill="#E0E7FF">
        <g transform="translate(450 282)">
          <rect width="86" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
          <text x="43" y="23" text-anchor="middle">Paper</text>
        </g>
        <g transform="translate(548 282)">
          <rect width="104" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
          <text x="52" y="23" text-anchor="middle">Velocity</text>
        </g>
        <g transform="translate(664 282)">
          <rect width="108" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
          <text x="54" y="23" text-anchor="middle">Argon2id</text>
        </g>
        <g transform="translate(784 282)">
          <rect width="116" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
          <text x="58" y="23" text-anchor="middle">TOTP 2FA</text>
        </g>
        <g transform="translate(912 282)">
          <rect width="106" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
          <text x="53" y="23" text-anchor="middle">Java 17+</text>
        </g>
      </g>
    </g>
  </g>
</svg>
